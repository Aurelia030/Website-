/* Listing pages, prepared inquiry links and a native-dialog photo gallery. */
function apartmentCategory(apartment){return apartment.category||'zeit';}
function apartmentRentalLabel(apartment){return apartmentCategory(apartment)==='kurzzeit'?'Kurzzeitvermietung':'Wohnen auf Zeit';}
function apartmentDisplayName(apartment){return apartment.shortName||apartment.name;}
function findApartment(value) {
  if (value && typeof value === 'object') return value;
  return APARTMENT_DATA.find(apartment => apartment.slug === String(value || '').toLowerCase());
}
function apartmentMailto(apartmentOrSlug = '') {
  const apartment = findApartment(apartmentOrSlug);
  const subject = apartment ? `Anfrage für das Apartment ${apartment.name}` : 'Anfrage für ein Apartment in Berlin';
  const body = [
    'Guten Tag Aurelia Apartments,', '',
    apartment ? `Ich interessiere mich für das Apartment ${apartment.name}.` : 'Ich interessiere mich für ein Apartment in Berlin.', '',
    ...(apartment ? [] : ['Gewünschtes Apartment: [bitte eintragen]', '']),
    'Gewünschter Zeitraum:', 'Anreise: [Datum eintragen]', 'Abreise: [Datum eintragen]',
    'Anzahl der Personen: [bitte eintragen]', '',
    'Meine Fragen oder Wünsche: [optional ergänzen]', '',
    'Bitte teilen Sie mir die Verfügbarkeit und die Konditionen für diesen Zeitraum mit.', '',
    'Freundliche Grüße', '[Ihr Name]'
  ].join('\r\n');
  return `mailto:info@aurelia-apartments.de?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function apartmentMenuItems() {
  return `<div class="apartment-menu-groups">${[['zeit','Wohnen auf Zeit'],['kurzzeit','Kurzzeitvermietung']].map(([category,label])=>`<div><a class="apartment-menu-category" href="#wohnungen/${category}">${label}</a><ul class="apartment-menu-items" aria-label="${label}">${APARTMENT_DATA.filter(a=>apartmentCategory(a)===category).map(apartment=>`<li><a href="#apartment/${apartment.slug}">${apartmentDisplayName(apartment)}<span aria-hidden="true">↗</span></a></li>`).join('')}</ul></div>`).join('')}</div>`;
}
function apartmentAvailability(apartment){
  if(!apartment.availableFrom)return '';
  const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  if(apartment.availableUntil&&today>apartment.availableUntil)return 'Verfügbarkeit auf Anfrage';
  const fmt=date=>new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Berlin'}).format(new Date(date+'T12:00:00Z'));
  const start=today>=apartment.availableFrom?'Ab sofort verfügbar':'Ab '+fmt(apartment.availableFrom);
  if(!apartment.availableUntil)return start;
  return `${today>=apartment.availableFrom?'Ab sofort':'Ab '+fmt(apartment.availableFrom)} bis ${fmt(apartment.availableUntil)}`;
}
function apartmentAmenities(apartment){
  if(!apartment.amenities?.length&&!apartment.amenityGroups?.length)return '';
  const groups=apartment.amenityGroups||[{title:'',items:apartment.amenities}];
  return `<div class="apartment-equipment"><h3>Ausstattung & Besonderheiten</h3><div class="amenity-groups">${groups.map(group=>`<section class="amenity-group">${group.title?`<h4>${group.title}</h4>`:''}<ul>${group.items.map(item=>`<li>${originalIcons['check']}<span>${item}</span></li>`).join('')}</ul></section>`).join('')}</div><p>Weitere Ausstattungsdetails erhalten Sie auf Anfrage.</p></div>`;
}
function apartmentRoomDetails(apartment){
  if(!apartment.roomDetails)return '';
  return `<section class="apartment-room-details"><h3>Zimmer & Wohnen</h3><dl>${apartment.roomDetails.map(([label,value])=>`<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl></section>`;

    <section class="wrap section apartment-detail-grid"><div class="apartment-detail-copy"><div class="eyebrow">Ihr Zuhause in Berlin</div><h2>Raum zum Ankommen.</h2><p class="apartment-detail-description">${apartment.description}</p>

let apartmentGalleryController = null;
function closeApartmentGallery() {
  const dialog = document.getElementById('apartment-lightbox');

  if (apartmentGalleryController) { apartmentGalleryController.abort(); apartmentGalleryController = null; }

}

    const move = direction => { index = (index + direction + apartment.images.length) % apartment.images.length; show(); };
    dialog.querySelector('[data-gallery-close]').onclick = () => dialog.close();
    dialog.querySelector('[data-gallery-prev]').onclick = () => move(-1);
    dialog.querySelector('[data-gallery-next]').onclick = () => move(1);
    dialog.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') { event.preventDefault(); move(-1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); move(1); }
    });
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
    dialog.addEventListener('close', () => { dialog.remove(); if (!document.querySelector('dialog[open]')) document.body.classList.remove('locked'); });

let revealObserver;
function initReveals(){
  // A real space survives mobile layouts that hide a visual line break.
  // Keep semantic headings and their <br> elements instead of rebuilding HTML.
  document.querySelectorAll('#main br').forEach(br=>{
    const next=br.nextSibling;
    if(next && !(next.nodeType===Node.TEXT_NODE && /^\s/.test(next.nodeValue)))br.after(document.createTextNode(' '));
  });
  revealObserver?.disconnect();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||matchMedia('(max-width:760px)').matches||!('IntersectionObserver' in window)){
    document.querySelectorAll('#main .reveal').forEach(el=>el.classList.add('is-visible'));
    return;
  }
  const elements=document.querySelectorAll('#main .eyebrow,#main h1,#main h2,#main h3,#main .hero>p,#main .hero>.actions,#main .audience>.card,#main .grid3>.apartment,#main .benefits>div,#main .partners>.card,#main .compare,#main .editorial-photo,#main .faq details,#main .step,#main .about-portrait,#main .about-introduction,#main .about-principles>article,#main .about-space');
  revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
    if(entry.isIntersecting){entry.target.classList.add('is-visible');revealObserver.unobserve(entry.target)}
  }),{threshold:0,rootMargin:'0px 0px -24px 0px'});
  elements.forEach(el=>{
    if(el.getBoundingClientRect().bottom<0){el.classList.add('is-visible');return;}
    el.classList.add('reveal');
    const stagger=el.matches('.apartment,.step,.partners>.card,.benefits>div')?Math.min([...el.parentElement.children].indexOf(el)*55,165):0;
    el.style.setProperty('--reveal-delay',stagger+'ms');revealObserver.observe(el);
  });
}
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{
  revealObserver?.disconnect();document.querySelectorAll('.reveal').forEach(el=>el.classList.add('is-visible'));
});

ld sie für die Bearbeitung nicht mehr benötigt werden, soweit keine gesetzlichen Aufbewahrungspflichten oder berechtigten Gründe zur weiteren Speicherung bestehen. Die konkreten Löschfristen und Abläufe einschließlich der bei Tally gespeicherten Dateien sind vor Veröffentlichung festzulegen.</p><h2>Datenschutz-Auswahl und externe Dienste</h2><p>Google Maps, Matterport und Tally werden nur nach Ihrer Einwilligung und Betätigung des jeweiligen Lade-Buttons geladen. Ihre Auswahl speichern wir unter dem Schlüssel aurelia-privacy-v1 für 180 Tage im lokalen Browserspeicher. Diese Speicherung dient dazu, Ihre Datenschutz-Auswahl zu beachten. Die Einbindung optionaler Inhalte erfolgt auf Grundlage von Art. 6 Abs. 1 lit. a DSGVO und, soweit erforderlich, § 25 Abs. 1 TDDDG. Sie können Ihre Einwilligung jederzeit über die Datenschutz-Einstellungen im Footer für die Zukunft widerrufen. Dabei werden geladene externe Inhalte geschlossen und weitere Ladevorgänge gesperrt. Bereits übermittelte Daten und beim Anbieter gespeicherte Cookies werden dadurch nicht gelöscht. Die Website bindet keine eigenen Analyse- oder Marketingwerkzeuge ein.</p><h2>Ihre Rechte</h2><p>Sie haben nach Maßgabe der gesetzlichen Voraussetzungen das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung und Datenübertragbarkeit. Soweit eine Verarbeitung auf Ihrer Einwilligung beruht, können Sie diese jederzeit mit Wirkung für die Zukunft widerrufen. Soweit wir Daten auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO verarbeiten, können Sie aus Gründen, die sich aus Ihrer besonderen Situation ergeben, Widerspruch einlegen. Bei Direktwerbung besteht ein jederzeitiges Widerspruchsrecht. Wenden Sie sich hierzu an die oben genannten Kontaktdaten. Sie können sich bei einer Datenschutzaufsichtsbehörde beschweren, insbesondere bei der Berliner Beauftragten für Datenschutz und Informationsfreiheit; Informationen finden Sie auf <a href="https://www.datenschutz-berlin.de/" target="_blank" rel="noopener noreferrer"><u>datenschutz-berlin.de</u></a>.</p><h2>Externe Inhalte und Browserspeicher – aktueller Entwurf</h2><p>Die Apartmentfotos, das Porträt und die KI-generierten Illustrationen sind direkt in die Website eingebettet. Für diese Bilder wird keine Verbindung zu einem externen Bildanbieter hergestellt. Schriftarten werden lokal bereitgestellt. Ihre Auswahl zu optionalen externen Diensten wird für 180 Tage lokal in diesem Browser gespeichert. Sie können sie jederzeit über die Datenschutz-Einstellungen im Footer ändern. Die Website bindet selbst keine Analysewerkzeuge ein. Die Umgebungskarten auf den Apartmentseiten werden erst nach einem Klick auf „Google Maps laden“ eingebettet. Dabei stellen wir eine Verbindung zu Google her. Google kann technische Daten wie Ihre IP-Adresse verarbeiten und Cookies setzen. Die Kartenabfrage enthält nur einen Straßennamen oder einen Stadtteil, keine Hausnummer. Die genaue Apartmentadresse wird nicht an den Kartendienst übermittelt. Weitere Informationen: <a href="https://policies.google.com/privacy?hl=de" target="_blank" rel="noopener noreferrer"><u>Google Datenschutz</u></a>. Im Sanierungsbereich werden zwei 360°-Rundgänge von Matterport erst nach Klick auf „Rundgang laden“ eingebettet. Dabei wird eine Verbindung zu my.matterport.com hergestellt. Matterport kann technische Daten wie Ihre IP-Adresse verarbeiten und Cookies setzen. Alternativ können die Rundgänge über die Direktlinks beim Anbieter geöffnet werden. Weitere Informationen: <a href="https://matterport.com/legal/privacy-policy" target="_blank" rel="noopener noreferrer"><u>Matterport Datenschutz</u></a>. Auf der Anfrageseite wird das Formular von Tally erst nach Klick auf „Formular laden“ eingebettet. Dadurch wird eine Verbindung zu tally.so hergestellt und es können technische Daten, insbesondere Ihre IP-Adresse, an Tally übermittelt und Cookies gesetzt werden. Wenn Sie das Formular absenden, werden Ihre Angaben und gegebenenfalls hochgeladene Dateien durch Tally zur Bearbeitung Ihrer Anfrage verarbeitet. Über den Direktlink können Sie das Formular auch unmittelbar bei Tally öffnen. Weitere Informationen finden Sie unter <a href="https://tally.so/help/privacy-policy" target="_blank" rel="noopener noreferrer"><u>Tally Datenschutz</u></a>. Die vollständigen Angaben zu Verantwortlichem, Rechtsgrundlagen, Aufbewahrung, Empfängern und Betroffenenrechten sind vor Veröffentlichung zu ergänzen. Bei Kontakt per E-Mail oder Telefon nutzen Sie die jeweilige Anwendung.</p>':'<h2>Anbieter</h2><p>Aurelia Apartments UG (haftungsbeschränkt)<br>Wiclefstraße 66<br>10551 Berlin<br>Deutschland</p><h2>Vertretung</h2><p>Geschäftsführer: Matteo Hauschild</p><h2>Handelsregister</h2><p>Registergericht: Amtsgericht Charlottenburg<br>Registernummer: HRB 280598 B</p><h2>Erlaubnis und Aufsichtsbehörde</h2><p>Erlaubnis nach § 34c Abs. 1 Satz 1 Nr. 1 und Nr. 4 Gewerbeordnung (GewO) für Immobilienvermittlung und Wohnimmobilienverwaltung.</p><p>Zuständige Aufsichtsbehörde:<br>Bezirksamt Mitte von Berlin – Ordnungsamt<br>Karl-Marx-Allee 31<br>10178 Berlin<br><a href="https://www.berlin.de/ba-mitte/politik-und-verwaltung/aemter/ordnungsamt/" target="_blank" rel="noopener noreferrer"><u>Website des Ordnungsamts Mitte</u></a></p><h2>Umsatzsteuer-Identifikationsnummer</h2><p>Umsatzsteuer-Identifikationsnummer gemäß § 27a Umsatzsteuergesetz: DE458534853</p>'}</section>`}

function openMenu(){const menu=$('#menu');menu.innerHTML=`<div class="menu-top"><a href="#start">${brand()}</a><button type="button" aria-label="Menü schließen" id="close-menu">×</button></div><nav class="menu-links"><a href="#eigentuemer">Für Eigentümer</a><div class="menu-apartment-group"><a href="#wohnungen">Apartments finden</a>${apartmentMenuItems()}</div><a href="#ueber-uns">Über uns</a></nav><div class="menu-bottom">${btn('Kostenlose Anfrage','#anfrage','light')}<a href="tel:+4915772119082">+49 157 72119082</a></div>`;menu.showModal();document.body.classList.add('locked');$('#close-menu').onclick=()=>menu.close();menu.querySelectorAll('a[href^="#"]').forEach(a=>a.onclick=()=>menu.close());}
$('#menu').addEventListener('close',()=>document.body.classList.remove('locked'));
function filterApartments(key){
  document.querySelectorAll('[data-filter]').forEach(button=>{button.classList.toggle('active',button.dataset.filter===key);button.setAttribute('aria-pressed',String(button.dataset.filter===key))});
  $('#apartment-list').innerHTML=apartmentCards(key)||`<div class="empty"><h4>Ihr gewünschter Aufenthalt.</h4><p>Fragen Sie Ihren Zeitraum direkt bei uns an.</p><a class="text-link" href="${apartmentMailto()}">Verfügbarkeit anfragen</a></div>`;
}
function bind(){
  initSitePhotos();
  bindApartmentPages();
  initApproximateMap();
  initTours();
  document.querySelectorAll('.compare input').forEach(r=>r.oninput=()=>{r.parentElement.style.setProperty('--split',r.value+'%');r.setAttribute('aria-valuetext',`${r.value} Prozent vorher, ${100-Number(r.value)} Prozent nachher`)});
  document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-service]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-selected',String(x===b))});$('#service-detail').innerHTML=serviceDetail(Number(b.dataset.service));$('#service-detail').setAttribute('aria-labelledby',b.id)});
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filterApartments(b.dataset.filter);initReveals()});
  initTally();
}
function render(){
  closeApartmentGallery();
  const [page,filter]=location.hash.slice(1).split('/');
  const renter=page==='wohnungen'||page==='apartment';
  const selected=page==='apartment'?findApartment(filter):null;
  const rentalInquiry=apartmentMailto(selected||'');
  $('#header').innerHTML=`<a class="brand-link" href="#start" aria-label="Aurelia Apartments Startseite">${brand(true)}</a><nav aria-label="Hauptnavigation"><a href="#eigentuemer">Für Eigentümer</a><a href="#wohnungen">Wohnung finden</a><a href="#ueber-uns">Über uns</a><button class="menu-toggle" aria-label="Menü öffnen" aria-haspopup="dialog">${originalIcons['equal']}</button></nav>${btn(renter?'Apartment anfragen':'Kostenlose Anfrage',renter?rentalInquiry:'#anfrage','shadow')}`;
  $('.menu-toggle').onclick=openMenu;
  const routes={start:home,eigentuemer:owners,wohnungen:renters,apartment:()=>apartmentDetail(filter),anfrage:inquiry,sanierung:renovation,'ueber-uns':about,impressum:()=>legalPage(false),datenschutz:()=>legalPage(true)};
  $('#main').innerHTML=(routes[page]||home)();$('#footer').innerHTML=footer();
  document.getElementById('mobile-contact')?.remove();
  if(!['anfrage','impressum','datenschutz'].includes(page))document.body.insertAdjacentHTML('beforeend',`<div id="mobile-contact">${btn(renter?'Apartment anfragen':'Kostenlose Anfrage',renter?rentalInquiry:'#anfrage')}</div>`);
  document.title=(selected?selected.name+' · '+apartmentRentalLabel(selected):page==='eigentuemer'?'Für Eigentümer':renter?'Wohnung finden':page==='anfrage'?'Kostenlose Erstanalyse':page==='ueber-uns'?'Über uns':page==='impressum'?'Impressum':page==='datenschutz'?'Datenschutz':page==='sanierung'?'Sanierung & Einrichtung':'Möbliertes Wohnen in Berlin')+' · Aurelia Apartments';
  bind();window.scrollTo({top:0,behavior:'instant'});$('#header').classList.remove('is-scrolled','nav-away');requestAnimationFrame(initReveals);window.aureliaMotionRefresh?.();
  if(page==='wohnungen'&&filter){filterApartments(filter==='kurzzeit'?'kurzzeit':'zeit');requestAnimationFrame(()=>$('#apartments').scrollIntoView({behavior:'instant'}))}
}

us is Berlin. Depending on the property, we may also be able to help elsewhere in Germany.","Nos centramos en Berlín. Según el inmueble, también podemos ofrecer nuestros servicios en otras zonas de Alemania."],"Der grüne Innenhof":["The leafy courtyard","El patio ajardinado"],"Der Innenhof":["The courtyard","El patio interior"],"Detailansicht der gefliesten Dusche mit Armaturen":["Detail of the tiled shower and its fittings","Detalle de la ducha alicatada y su grifería"],"Details ansehen →":["View details →","Ver detalles →"],"Deutsch":["German","Alemán"],"Deutschland":["Germany","Alemania"],"Die Apartmentfotos, das Porträt und die KI-generierten Illustrationen sind direkt in die Website eingebettet. Für diese Bilder wird keine Verbindung zu einem externen Bildanbieter hergestellt. Schriftarten werden lokal bereitgestellt. Ihre Auswahl zu optionalen externen Diensten wird für 180 Tage lokal in diesem Browser gespeichert. Sie können sie jederzeit über die Datenschutz-Einstellungen im Footer ändern. Die Website bindet selbst keine Analysewerkzeuge ein. Die Umgebungskarten auf den Apartmentseiten werden erst nach einem Klick auf „Google Maps laden“ eingebettet. Dabei stellen wir eine Verbindung zu Google her. Google kann technische Daten wie Ihre IP-Adresse verarbeiten und Cookies setzen. Die Kartenabfrage enthält nur einen Straßennamen oder einen Stadtteil, keine Hausnummer. Die genaue Apartmentadresse wird nicht an den Kartendienst übermittelt. Weitere Informationen:":["The apartment photos, portrait and AI-generated illustrations are embedded directly in the website. These images do not establish a connection to an external image provider. Fonts are served locally. Your choice of optional external services is stored locally in this browser for 180 days. You can change it at any time using the privacy settings in the footer. The website itself does not integrate analytics tools. Neighbourhood maps on the apartment pages are embedded only after you click “Load Google Maps”. This establishes a connection to Google. Google may process technical data such as your IP address and set cookies. The map search includes only a street name or district, not a building number. The exact apartment address is not transmitted to the map service. Further information:","Las fotografías de los apartamentos, el retrato y las ilustraciones generadas por IA están integrados directamente en el sitio web. Estas imágenes no establecen ninguna conexión con un proveedor externo de imágenes. Las fuentes se sirven localmente. Su selección de servicios externos opcionales se guarda localmente en este navegador durante 180 días. Puede cambiarla en cualquier momento mediante los ajustes de privacidad del pie de página. El propio sitio web no integra herramientas de análisis. Los mapas del entorno de las páginas de los apartamentos solo se insertan después de hacer clic en «Cargar Google Maps». Esto establece una conexión con Google. Google puede tratar datos técnicos, como su dirección IP, e instalar cookies. La búsqueda del mapa solo incluye el nombre de una calle o un barrio, sin número de portal. La dirección exacta del apartamento no se transmite al servicio de mapas. Más información:"],"Die Apartments sind möbliert und ausgestattet. WLAN und Nebenkosten sind inklusive; die genauen Konditionen erhalten Sie mit dem individuellen Angebot.":["The apartments are furnished and equipped. Wi-Fi and utilities are included; you will receive the exact terms with your individual offer.","Los apartamentos están amueblados y equipados. El wifi y los gastos de suministros están incluidos; recibirá las condiciones concretas con su oferta personalizada."],"Die Hausordnung des Gebäudes ist Bestandteil des Aufenthalts und einzuhalten.":["The building’s house rules form part of your stay and must be observed.","Las normas del edificio forman parte de las condiciones de la estancia y deben respetarse."],"Die Immobilie digital kennenlernen":["Explore the property digitally"," icherdauer und die Vereinbarung zur Auftragsverarbeitung sind vor Veröffentlichung anhand unseres Hosting-Vertrags zu prüfen und zu vervollständigen.":["Our public website and email services are hosted by STRATO. When you access the website, technically necessary data is processed, in particular your IP address, the time of access, the resources requested and browser information. This serves to deliver the website and ensure its stability and security, on the basis of Article 6(1)(f) GDPR. Before publication, the precise STRATO contracting entity, the actual log data, its retention period and the data processing agreement must be checked against our hosting contract and completed.","El sitio web público y nuestros servicios de correo electrónico se alojan en STRATO. Al acceder al sitio web se tratan datos técnicamente necesarios, en particular la dirección IP, la fecha y hora del acceso, los recursos solicitados y la información del navegador. Este tratamiento permite ofrecer el sitio web y garantizar su estabilidad y seguridad, sobre la base del artículo 6, apartado 1, letra f, del RGPD. Antes de la publicación, deben comprobarse y completarse, conforme a nuestro contrato de alojamiento, la entidad de STRATO contratante, los datos de registro que se recogen realmente, su plazo de conservación y el contrato de encargo del tratamiento."],"Die private begrünte Terrasse des Apartments LEANDROS mit Sitzbereich":["The private leafy terrace of the LEANDROS apartment with seating area","Terraza privada ajardinada del apartamento LEANDROS con zona de asientos"],"Die private Terrasse":["The private terrace","La terraza privada"],"Die private Terrasse von LEANDROS vergrößern":["Enlarge the private terrace photo for LEANDROS","Ampliar la foto de la terraza privada de LEANDROS"],"Die Rundgänge werden von Matterport bereitgestellt. Erst beim Laden wird eine Verbindung zu Matterport hergestellt; dabei können technische Daten übertragen und Cookies gesetzt werden.":["The tours are erspeicher. Diese Speicherung dient dazu, Ihre Datenschutz-Auswahl zu beachten. Die Einbindung optionaler Inhalte erfolgt auf Grundlage von Art. 6 Abs. 1 lit. a DSGVO und, soweit erforderlich, § 25 Abs. 1 TDDDG. Sie können Ihre Einwilligung jederzeit über die Datenschutz-Einstellungen im Footer für die Zukunft widerrufen. Dabei werden geladene externe Inhalte geschlossen und weitere Ladevorgänge gesperrt. Bereits übermittelte Daten und beim Anbieter gespeicherte Cookies werden dadurch nicht gelöscht. Die Website bindet keine eigenen Analyse- oder Marketingwerkzeuge ein.":["Google Maps, Matterport and Tally are loaded only with your consent and after you select the relevant load button. We store your choice under the key aurelia-privacy-v1 in your browser’s local storage for 180 days so that we can respect your privacy choices. Optional content is embedded on the basis of Article 6(1)(a) GDPR and, where required, Section 25(1) of the German TDDDG. You may withdraw your consent at any time with future effect using the privacy settings in the footer. Loaded external content is then closed and further loading is blocked. This does not erase data already transmitted or cookies stored by the provider. The website does not integrate its own analytics or marketing tools.","Google Maps, Matterport y Tally solo se cargan con su consentimiento y cuando pulsa el botón de carga correspondiente. Guardamos su elección con la clave aurelia-privacy-v1 en el almacenamiento local del navegador durante 180 días para respetar sus preferencias de privacidad. El contenido opcional se integra sobre la base del artículo 6, apartado 1, letra a, del RGPD y, cuando sea necesario, del artículo 25, apartado 1, de la ley alemana TDDDG. Puede retirar su consentimiento en cualquier momento, con efectos futuros, mediante los ajustes de privacidad del pie de página. En ese caso, se cierra el contenido externo cargado y se bloquean nuevas cargas. Esto no elimina los datos ya transmitidos ni las cookies guardadas por el proveedor. El sitio no integra herramientas propias de análisis ni de publicidad."]};

/* Native browser scrolling; optional desktop-only visual motion. */
(() => {
  const preference=matchMedia('(prefers-reduced-motion: reduce)');
  const mobile=matchMedia('(max-width:760px)');
  let frame=0,lastY=scrollY,directionDistance=0,panels=[];
  const clamp=(value,min,max)=>Math.max(min,Math.min(value,max));
  function updateVisuals(){
    frame=0;
    const header=document.getElementById('header');
    if(mobile.matches||preference.matches){
      header?.classList.remove('nav-away');
      for(const panel of panels)panel.style.removeProperty('--parallax-y');
      lastY=scrollY;directionDistance=0;return;
    }
    const delta=scrollY-lastY;
    if(Math.sign(delta)!==Math.sign(directionDistance))directionDistance=0;
    directionDistance+=delta;
    if(header){
      const keep=scrollY<220||header.contains(document.activeElement)||document.body.classList.contains('locked');
      if(keep||directionDistance< -14)header.classList.remove('nav-away');
      else if(directionDistance>38)header.classList.add('nav-away');
    }
    lastY=scrollY;
    // Batch geometry reads before style writes. Mobile never uses parallax.
    const visible=panels.map(panel=>({panel,rect:panel.getBoundingClientRect()})).filter(({rect})=>rect.bottom>=0&&rect.top<=innerHeight);
    for(const {panel,rect} of visible){
      const offset=clamp((rect.top+rect.height/2-innerHeight/2)*-.028,-13,13);
      panel.style.setProperty('--parallax-y',offset.toFixed(2)+'px');
    }
  }
  function schedule(){if(!frame)frame=requestAnimationFrame(updateVisuals)}
  function refresh(){
    lastY=scrollY;directionDistance=0;
    document.getElementById('header')?.classList.remove('nav-away');
    panels=[...document.querySelectorAll('#main .brand-panel,#main .editorial-photo-frame')];
    schedule();
  }
  window.aureliaMotionRefresh=refresh;
  addEventListener('scroll',()=>{if(!mobile.matches&&!preference.matches)schedule()},{passive:true});
  addEventListener('resize',schedule,{passive:true});
  mobile.addEventListener('change',()=>{initReveals();refresh()});
  preference.addEventListener('change',refresh);
  document.addEventListener('focusin',event=>{if(event.target.closest?.('header'))document.getElementById('header')?.classList.remove('nav-away')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0}else refresh()});
  refresh();
})();
